[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kanon"
version = "0.1.0"
description = "k-anonymity helpers for publishing tabular microdata"
requires-python = ">=3.10"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["kanon"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]